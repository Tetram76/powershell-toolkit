name: Unit tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pester:
    name: Pester (${{ matrix.os }}, ${{ matrix.powershell }})

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        powershell:
          - '7.6.5'

    env:
      POWERSHELL_VERSION: ${{ matrix.powershell }}

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      # Les manifestes exigent 7.6 ; le pwsh préinstallé du runner peut être plus ancien.
      - name: Setup PowerShell
        uses: PSModule/install-powershell@v1
        with:
          Version: ${{ matrix.powershell }}

      - name: Check PowerShell version
        shell: pwsh
        run: |
          Write-Host "Requested: $env:POWERSHELL_VERSION"
          Write-Host "Running:   $($PSVersionTable.PSVersion)"

      - name: Install Pester
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          # ubuntu-latest : PowerShellGet n'a plus PSGallery ; PSResourceGet si.
          Install-PSResource -Name Pester -Scope CurrentUser -TrustRepository

      - name: Run Pester
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Push-Location $env:GITHUB_WORKSPACE
          try {
            & "$env:GITHUB_WORKSPACE/tools/Invoke-Tests.ps1" -Coverage
          }
          finally {
            Pop-Location
          }

      - name: Publish Pester test report
        uses: dorny/test-reporter@v2
        if: (success() || failure()) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        with:
          name: Pester Tests (${{ matrix.os }}, ${{ matrix.powershell }})
          path: TestResults.xml
          reporter: java-junit
          fail-on-error: false

      - name: Write job summary (Pester)
        if: success() || failure()
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          @'
          ## Résultats Pester (${{ matrix.os }}, ${{ matrix.powershell }})

          - **JUnit XML :** `TestResults.xml` (racine du workspace)
          - **Couverture JaCoCo :** `coverage.xml` (si généré par `Invoke-Tests.ps1` avec `-Coverage`)
          - **Rapport de tests (check / annotations) :** étape *Publish Pester test report* (`dorny/test-reporter`)
          - **Fichiers bruts téléchargeables :** artefacts **pester-test-results-${{ matrix.os }}-${{ matrix.powershell }}** et **pester-coverage-${{ matrix.os }}-${{ matrix.powershell }}**
          '@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload test results (JUnit)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pester-test-results-${{ matrix.os }}-${{ matrix.powershell }}
          path: TestResults.xml

      - name: Upload code coverage (JaCoCo)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pester-coverage-${{ matrix.os }}-${{ matrix.powershell }}
          path: coverage.xml
